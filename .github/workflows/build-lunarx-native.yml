name: Build LunarX Native for Tachimanga

on:
  push:
    branches:
      - lunarx
    paths:
      - '.github/workflows/build-lunarx-native.yml'
      - 'lunarx-native-build.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout custom repository branch
        uses: actions/checkout@v4
        with:
          ref: lunarx
          path: repo
          persist-credentials: true

      - name: Checkout dedicated LunarX source
        uses: actions/checkout@v4
        with:
          repository: codegeasse1/codegeasse-mihon-extension
          ref: f9a96725074aee580b27ab39081175de9aee3e11
          path: native
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish dedicated LunarX
        run: bash repo/lunarx-native-build.sh
