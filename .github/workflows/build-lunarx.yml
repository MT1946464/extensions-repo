name: Build LunarX for Tachimanga

on:
  push:
    branches:
      - lunarx
    paths:
      - '.github/workflows/build-lunarx.yml'
      - 'lunarx-build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout custom repository branch
        uses: actions/checkout@v4
        with:
          ref: lunarx
          path: repo
          persist-credentials: true

      - name: Checkout Keiyoushi extension source
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch build for Tachimanga and LunarX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Make this a distinct extension instead of colliding with Keiyoushi's package.
          gradle = Path('source/src/all/lunaranime/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('name = "Lunar Manga"', 'name = "LunarX Manga"')
          text = text.replace('versionCode = 12', 'versionCode = 15')
          text = text.replace('baseUrl = "https://lunaranime.ru"', 'baseUrl = "https://lunarx.to"')
          marker = 'name = "LunarX Manga"\n'
          if marker not in text:
              raise SystemExit('Could not find Lunar extension name block')
          text = text.replace(marker, marker + '    pkgName = "all.lunarx"\n', 1)
          gradle.write_text(text)

          # Tachimanga compatibility: its loader requires Android API 21-compatible bytecode.
          versions = Path('source/gradle/kei.versions.toml')
          text = versions.read_text()
          if 'android-sdk-min = "26"' not in text:
              raise SystemExit('Expected Keiyoushi minSdk 26 not found')
          versions.write_text(text.replace('android-sdk-min = "26"', 'android-sdk-min = "21"', 1))

          # Tachimanga currently rejects/has trouble with R8/ProGuard-optimized custom builds.
          plugin = Path('source/gradle/build-logic/src/main/kotlin/ExtensionPlugin.kt')
          text = plugin.read_text()
          if 'isMinifyEnabled = true' not in text:
              raise SystemExit('Expected minification setting not found')
          plugin.write_text(text.replace('isMinifyEnabled = true', 'isMinifyEnabled = false', 1))

          # Lunar domain migration.
          lunar = Path('source/src/all/lunaranime/src/eu/kanade/tachiyomi/extension/all/lunaranime/LunarAnime.kt')
          text = lunar.read_text()
          text = text.replace('https://api.lunaranime.ru', 'https://api.lunarx.to')
          text = text.replace('https://storage.lunaranime.ru', 'https://vault.lunarx.to')
          old = 'return GET(page.imageUrl!!, imageHeaders)'
          new = 'return GET(page.imageUrl!!.replace("https://storage.lunaranime.ru", "https://vault.lunarx.to"), imageHeaders)'
          if old not in text:
              raise SystemExit('Expected imageRequest line not found')
          lunar.write_text(text.replace(old, new, 1))
          PY

      - name: Build compatibility APK and JAR
        working-directory: source
        run: ./gradlew :src:all:lunaranime:assembleRelease

      - name: Publish Tachimanga repository
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          module = Path('source/src/all/lunaranime/build')
          info_path = module / 'keiyoushi-source-info.json'
          if not info_path.exists():
              raise SystemExit(f'Missing source metadata: {info_path}')
          info = json.loads(info_path.read_text())

          apks = list((module / 'outputs/apk/release').glob('*.apk'))
          jars = list((module / 'outputs/jar/release').glob('*.jar'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one APK, found {apks}')
          if len(jars) != 1:
              raise SystemExit(f'Expected one JAR, found {jars}')
          apk = apks[0]
          jar = jars[0]

          repo = Path('repo')
          apk_dir = repo / 'apk'
          jar_dir = repo / 'jar'
          apk_dir.mkdir(parents=True, exist_ok=True)
          jar_dir.mkdir(parents=True, exist_ok=True)

          # Remove our earlier colliding Lunar builds.
          for pattern in ('tachiyomi-all.lunaranime-v*', 'tachiyomi-all.lunarx-v*'):
              for old in apk_dir.glob(pattern):
                  old.unlink()
              for old in jar_dir.glob(pattern):
                  old.unlink()

          shutil.copy2(apk, apk_dir / apk.name)
          shutil.copy2(jar, jar_dir / jar.name)

          # Legacy Tachimanga repository resolution uses the apk/ directory even when
          # the extension filename itself ends in .jar, so keep a JAR copy there too.
          shutil.copy2(jar, apk_dir / jar.name)

          sources = []
          for src in info['sources']:
              item = {
                  'name': src['name'],
                  'lang': src['lang'],
                  'id': str(src['id']),
                  'baseUrl': src['baseUrl'],
              }
              if 'versionId' in src:
                  item['versionId'] = src['versionId']
              sources.append(item)

          entry = {
              'name': f"Tachiyomi: {info['name']}",
              'pkg': info['packageName'],
              'apk': jar.name,
              'lang': 'all',
              'code': 15,
              'version': info['versionName'],
              'nsfw': 0,
              'sources': sources,
          }
          (repo / 'index.min.json').write_text(
              json.dumps([entry], ensure_ascii=False, separators=(',', ':')) + '\n'
          )

          # Remove inherited Keiyoushi v2 metadata. It points back to Keiyoushi and causes
          # this custom legacy repository to be identified as the Keiyoushi repository.
          for stale in ('repo.json', 'index.json', 'index.pb', 'release-assets.json'):
              p = repo / stale
              if p.exists():
                  p.unlink()

          jar_url = 'https://raw.githubusercontent.com/MT1946464/extensions-repo/lunarx/apk/' + jar.name
          repo_url = 'https://raw.githubusercontent.com/MT1946464/extensions-repo/lunarx/index.min.json'

          (repo / 'index.html').write_text(
              '<!doctype html><html><body><a href="apk/' + jar.name + '">Tachiyomi: LunarX Manga</a></body></html>\n'
          )
          (repo / 'README-LUNARX.md').write_text(
              '# LunarX Manga for Tachimanga\n\n'
              'Independent Tachimanga compatibility build.\n\n'
              'Repository URL: `' + repo_url + '`\n\n'
              'Direct JAR: `' + jar_url + '`\n\n'
              'Compatibility changes: minSdk 21, R8/ProGuard minification disabled, unique package `eu.kanade.tachiyomi.extension.all.lunarx`, and LunarX domains.\n'
          )
          PY

      - name: Commit published extension
        working-directory: repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No published changes"
            exit 0
          fi
          git commit -m "Publish Tachimanga-compatible LunarX v1.4.15"
          git push origin HEAD:lunarx
