name: Build LunarX for Tachimanga

on:
  push:
    branches:
      - lunarx
    paths:
      - '.github/workflows/build-lunarx.yml'
      - 'lunarx-build.sh'
      - 'lunarx-patches/**'
      - 'lunarx-build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout custom repository branch
        uses: actions/checkout@v4
        with:
          ref: lunarx
          path: repo
          persist-credentials: true

      - name: Checkout Keiyoushi extension source
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish LunarX
        run: bash repo/lunarx-build.sh
